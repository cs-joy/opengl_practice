<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse and search rental properties on KeyNest."
    />
    <title>Browse Properties | KeyNest</title>
    <link rel="icon" href="/images/logo/logo.jpeg" type="image/jpeg" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/client.css" />
  </head>
  <body class="client-page" data-page="browse">
    <header class="client-header">
      <div class="client-header__inner">
        <a href="/" class="client-brand">
          <img
            class="brand-logo"
            src="/images/logo/logo.jpeg"
            alt="KeyNest logo"
            width="44"
            height="44"
          />
          <span>KeyNest <span class="client-brand__suffix">Rentals</span></span>
        </a>
        <button
          type="button"
          class="client-menu-btn"
          id="client-menu-btn"
          aria-expanded="false"
          aria-controls="client-nav"
          aria-label="Open menu"
        >
          <span class="client-menu-btn__bars" aria-hidden="true">
            <span class="client-menu-btn__bar"></span>
            <span class="client-menu-btn__bar"></span>
            <span class="client-menu-btn__bar"></span>
          </span>
        </button>
        <nav class="client-nav" id="client-nav" aria-label="Client navigation">
          <a href="/" data-nav="home">Home</a>
          <a href="/browse.html" data-nav="browse">Browse</a>
          <a href="/about.html" data-nav="about">About</a>
          <a href="/contact.html" data-nav="contact">Contact Us</a>
          <a href="/admin/login.html" data-nav="admin">Admin</a>
        </nav>
      </div>
      <div
        class="client-nav-overlay"
        id="client-nav-overlay"
        aria-hidden="true"
      ></div>
    </header>

    <section class="client-hero client-hero--compact client-hero--motion">
      <div class="home-hero__bg-motion home-hero__bg-motion--subtle" aria-hidden="true">
        <span class="home-hero__blob home-hero__blob--1"></span>
      </div>
      <div class="client-hero__inner">
        <h1>Browse properties</h1>
        <p>
          Search by keyword or monthly rent. Open a listing to view photos and request a
          booking.
        </p>
        <form id="search-form" class="search-panel" role="search">
          <div class="form-group">
            <label class="form-label" for="search-q">Keyword</label>
            <input
              class="form-input"
              type="search"
              id="search-q"
              name="q"
              placeholder="Name, address, or description"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="search-min-rent">Min rent (BDT)</label>
            <input
              class="form-input"
              type="number"
              id="search-min-rent"
              name="min_rent"
              min="0"
              step="100"
              placeholder="0"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="search-max-rent">Max rent (BDT)</label>
            <input
              class="form-input"
              type="number"
              id="search-max-rent"
              name="max_rent"
              min="0"
              step="100"
              placeholder="Any"
            />
          </div>
          <div class="form-group">
            <button type="submit" class="btn btn--primary" style="width: 100%">
              Search
            </button>
          </div>
        </form>
      </div>
    </section>

    <main class="client-main">
      <div id="client-list-alert" class="alert alert--error" role="alert"></div>

      <div class="client-section-head">
        <h2>All properties</h2>
        <span class="client-results-count" id="results-count">Loading…</span>
      </div>

      <div id="property-grid" class="property-grid" aria-live="polite">
        <p class="loading" style="grid-column: 1 / -1">Loading properties…</p>
      </div>
    </main>

    <footer class="client-footer">
      Copyright © KeyNest 2026. All rights reserved.
    </footer>

    <script src="/js/client-common.js"></script>
    <script src="/js/client-nav.js"></script>
    <script src="/js/client.js"></script>
  </body>
</html>
