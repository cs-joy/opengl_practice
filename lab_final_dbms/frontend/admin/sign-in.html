<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin sign in | KeyNest</title>
    <link rel="icon" href="/images/logo/logo.jpeg" type="image/jpeg" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-card panel">
      <div class="login-card__brand">
        <img
          class="brand-logo brand-logo--lg"
          src="/images/logo/logo.jpeg"
          alt="KeyNest logo"
          width="48"
          height="48"
        />
        <div>
          <h1 class="login-card__title">Admin sign in</h1>
          <p class="login-card__subtitle">KeyNest Management Suite</p>
        </div>
      </div>

      <div id="login-alert" class="alert alert--error" role="alert"></div>

      <form id="admin-login-form" class="login-form">
        <div class="form-group">
          <label class="form-label form-label--required" for="admin-email">Email</label>
          <input
            class="form-input"
            type="email"
            id="admin-email"
            name="email"
            required
            autocomplete="username"
            placeholder="admin@propertyms.local"
          />
        </div>
        <div class="form-group">
          <label class="form-label form-label--required" for="admin-password"
            >Password</label
          >
          <input
            class="form-input"
            type="password"
            id="admin-password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="••••••••"
          />
        </div>
        <button type="submit" class="btn btn--primary login-form__submit">
          Sign in
        </button>
      </form>

      <p class="login-card__footer">
        <a href="/">← Back to client site</a>
      </p>
    </main>

    <script src="/js/admin-login.js"></script>
  </body>
</html>
