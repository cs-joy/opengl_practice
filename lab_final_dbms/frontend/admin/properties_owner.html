<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenants | KeyNest Admin</title>
    <link rel="icon" href="/images/logo/logo.jpeg" type="image/jpeg" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="tenants">
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="sidebar__brand">
          <img
            class="brand-logo"
            src="/images/logo/logo.jpeg"
            alt="KeyNest logo"
            width="40"
            height="40"
          />
          <div>
            <div class="sidebar__title">KeyNest</div>
            <div class="sidebar__subtitle">Management Suite</div>
          </div>
        </div>
        <nav class="sidebar__nav">
          <a href="/admin/index.html" class="nav-link" data-nav="dashboard">
            <span class="nav-link__icon" aria-hidden="true">▣</span>
            <span>Dashboard</span>
          </a>
          <a href="/admin/contacts.html" class="nav-link" data-nav="contacts">
            <span class="nav-link__icon" aria-hidden="true">✉</span>
            <span>Messages</span>
            <span class="nav-link__badge" id="nav-contact-badge" data-count="0"></span>
          </a>
          <a href="/admin/properties.html" class="nav-link" data-nav="properties">
            <span class="nav-link__icon" aria-hidden="true">⌂</span>
            <span>Properties</span>
          </a>
          <a href="/admin/bookings.html" class="nav-link" data-nav="bookings">
            <span class="nav-link__icon" aria-hidden="true">📋</span>
            <span>Bookings</span>
          </a>
          <a href="/admin/tenants.html" class="nav-link" data-nav="tenants">
            <span class="nav-link__icon" aria-hidden="true">👤</span>
            <span>Tenants</span>
          </a>
          <a href="/" class="nav-link" data-nav="public">
            <span class="nav-link__icon" aria-hidden="true">🌐</span>
            <span>Client site</span>
          </a>
        </nav>
        <div class="sidebar__footer">
          <button type="button" id="admin-logout-btn" class="nav-link sidebar__logout">
            <span class="nav-link__icon" aria-hidden="true">⚙</span>
            <span>Sign out</span>
          </button>
          <div class="sidebar__session" id="admin-session-email">Admin</div>
        </div>
      </aside>

      <div class="main-wrapper">
        <header class="top-header">
          <h1 class="top-header__title">Tenant Management</h1>
          <span class="top-header__meta" id="header-date"></span>
        </header>

        <main class="page-content">
          <div class="panel-grid panel-grid--split">
            <section class="panel" aria-labelledby="add-tenant-title">
              <div class="panel__header">
                <h2 class="panel__title" id="add-tenant-title">Add Tenant</h2>
              </div>
              <div class="panel__body">
                <div id="tenant-form-alert" class="alert" role="alert"></div>
                <form id="tenant-form">
                  <div class="form-group">
                    <label class="form-label form-label--required" for="tenant-name"
                      >Full Name</label
                    >
                    <input
                      class="form-input"
                      type="text"
                      id="tenant-name"
                      name="name"
                      required
                      placeholder="Tenant name"
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label form-label--required" for="tenant-contact"
                      >Contact</label
                    >
                    <input
                      class="form-input"
                      type="text"
                      id="tenant-contact"
                      name="contact"
                      required
                      placeholder="Email or phone"
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="tenant-property-id">Property ID</label>
                    <select
                      class="form-select"
                      id="tenant-property-id"
                      name="property_id"
                    >
                      <option value="">— Unassigned —</option>
                    </select>
                    <p class="form-hint">Optional: assign tenant to a property on create.</p>
                  </div>
                  <div class="form-actions">
                    <button type="submit" class="btn btn--primary">Save Tenant</button>
                    <button type="reset" class="btn btn--secondary">Clear</button>
                  </div>
                </form>
              </div>
            </section>

            <section class="panel" aria-labelledby="tenants-list-title">
              <div class="panel__header">
                <h2 class="panel__title" id="tenants-list-title">All Tenants</h2>
              </div>
              <div class="panel__body table-wrapper">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th scope="col">ID</th>
                      <th scope="col">Name</th>
                      <th scope="col">Contact</th>
                      <th scope="col">Property</th>
                      <th scope="col">Assign</th>
                    </tr>
                  </thead>
                  <tbody id="tenants-table-body">
                    <tr>
                      <td colspan="5" class="loading">Loading…</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="/js/main.js"></script>
    <script src="/js/admin-auth.js"></script>
    <script src="/js/admin-chrome.js"></script>
    <script src="/js/tenants.js"></script>
  </body>
</html>
